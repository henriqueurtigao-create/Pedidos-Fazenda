<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pedidos da Fazenda</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#1F4D26">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pedidos da Fazenda">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Nunito+Sans:wght@400;600;700;800&display=swap">
<style>
/* Layout: faixa de cabeçalho branca com a logo, conteúdo em coluna única (celular), navegação fixa embaixo com botões grandes.
   Tema único claro, de alto contraste, pensado para uso no sol. */
:root{
  --verde:#1F4D26; --verde2:#2F7A35; --broto:#6DB33F; --ouro:#E2B33A; --terra:#7A5230;
  --fundo:#F3EFE4; --papel:#FFFDF8; --tinta:#1E2A1B; --sub:#5F6553; --linha:#E1D9C6; --suave:#ECE6D5;
  --amarelo:#B98A00; --amarelo-bg:#FFF4CC;
  --laranja:#C9620F; --laranja-bg:#FDE8D5;
  --roxo:#6A49AE; --roxo-bg:#ECE6F8;
  --azul:#1F6FB2; --azul-bg:#E0EEFA;
  --teal:#0E7E72; --teal-bg:#D9F2EE;
  --ok:#23803A; --ok-bg:#DDF2E0;
  --vermelho:#C2302A; --vermelho-bg:#FBE2DF;
  --cinza:#6B6F6A; --cinza-bg:#ECEDEA;
  --f-titulo:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --f-texto:"Nunito Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --raio:14px;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--fundo);color:var(--tinta)}
body{font-family:var(--f-texto);font-size:17px;line-height:1.4;min-height:100%;
  padding-left:max(0px, env(safe-area-inset-left, 0px));padding-right:max(0px, env(safe-area-inset-right, 0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--papel)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--ouro);outline-offset:2px}
h1,h2,h3{font-family:var(--f-titulo);margin:0;text-wrap:balance;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}

/* Cabeçalho */
.topo{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--papel);border-bottom:4px solid var(--verde2)}
.topo .wrap{display:flex;align-items:center;gap:12px;padding-block:8px}
.topo img{height:40px;width:auto;display:block}
.topo .quem{margin-left:auto;text-align:right;line-height:1.15;min-width:0;border:0;background:none;padding:4px 6px;border-radius:10px}
.topo .quem:active{background:var(--suave)}
.topo .quem b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
.topo .quem span{font-size:12.5px;color:var(--sub);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.icone-btn{border:0;background:var(--suave);border-radius:12px;min-width:44px;height:44px;font-size:20px;display:inline-flex;align-items:center;justify-content:center;position:relative}
.icone-btn .bolinha{position:absolute;top:-4px;right:-4px;background:var(--vermelho);color:#fff;font-size:12px;font-weight:800;border-radius:10px;padding:1px 6px}
.demo{background:var(--amarelo-bg);color:#6B5000;font-size:13.5px;font-weight:700;text-align:center;padding:6px 12px}

main{padding-block:16px 120px}
main > .wrap{display:flex;flex-direction:column;gap:16px}

/* Navegação inferior */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--papel);border-top:1px solid var(--linha);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav .wrap{display:flex;gap:4px;padding-block:6px}
.nav button{flex:1;border:0;background:none;border-radius:12px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12.5px;font-weight:800;color:var(--sub);position:relative}
.nav button .ic{font-size:23px;line-height:1}
.nav button.on{background:var(--suave);color:var(--verde)}
.nav button .bolinha{position:absolute;top:2px;left:55%;background:var(--vermelho);color:#fff;font-size:11px;font-weight:800;border-radius:10px;padding:0 6px}

/* Blocos */
.titulo-tela{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.titulo-tela h1{font-size:26px;font-weight:900;color:var(--verde)}
.titulo-tela p{margin:2px 0 0;color:var(--sub);font-size:15px}
.cartao{background:var(--papel);border:1px solid var(--linha);border-radius:var(--raio);padding:16px}
.secao-t{font-family:var(--f-titulo);font-size:14px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--sub);margin:4px 0 -6px;display:flex;align-items:center;gap:8px}
.secao-t .cont{background:var(--tinta);color:#fff;border-radius:10px;padding:0 8px;font-size:12.5px;letter-spacing:0}
.vazio{color:var(--sub);text-align:center;padding:22px 12px;background:var(--papel);border:1.5px dashed var(--linha);border-radius:var(--raio);font-size:15.5px}

/* Alertas */
.alertas{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.alerta{border:0;text-align:left;border-radius:var(--raio);padding:12px 14px;display:flex;flex-direction:column;gap:2px;background:var(--papel);border-left:6px solid var(--cinza);box-shadow:0 1px 0 var(--linha)}
.alerta .n{font-family:var(--f-titulo);font-size:32px;font-weight:900;line-height:1}
.alerta .l{font-size:14.5px;font-weight:800;line-height:1.2}
.alerta .s{font-size:12.5px;color:var(--sub);font-weight:700}
.alerta.zero{opacity:.55}
.alerta.c-amarelo{border-left-color:var(--ouro)} .alerta.c-amarelo .n{color:var(--amarelo)}
.alerta.c-laranja{border-left-color:var(--laranja)} .alerta.c-laranja .n{color:var(--laranja)}
.alerta.c-roxo{border-left-color:var(--roxo)} .alerta.c-roxo .n{color:var(--roxo)}
.alerta.c-azul{border-left-color:var(--azul)} .alerta.c-azul .n{color:var(--azul)}
.alerta.c-teal{border-left-color:var(--teal)} .alerta.c-teal .n{color:var(--teal)}
.alerta.c-verde{border-left-color:var(--ok)} .alerta.c-verde .n{color:var(--ok)}
.alerta.c-vermelho{border-left-color:var(--vermelho);background:var(--vermelho-bg)} .alerta.c-vermelho .n{color:var(--vermelho)}
.faixa-aviso{display:flex;gap:12px;align-items:center;background:var(--teal-bg);border:2px solid var(--teal);border-radius:var(--raio);padding:14px;font-weight:800}
.faixa-aviso.verm{background:var(--vermelho-bg);border-color:var(--vermelho)}
.faixa-aviso .grande{font-size:30px}

/* Chips de status */
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:12px;padding:3px 10px;font-size:13px;font-weight:800;max-width:100%;line-height:1.25}
.st-aguardando{background:var(--amarelo-bg);color:#7A5B00}
.st-separado{background:var(--azul-bg);color:var(--azul)}
.st-compra,.st-cotacao{background:var(--laranja-bg);color:#9A4A08}
.st-comprado{background:var(--roxo-bg);color:var(--roxo)}
.st-nasede{background:var(--azul-bg);color:var(--azul)}
.st-enviado{background:var(--teal-bg);color:var(--teal)}
.st-recebido{background:var(--ok-bg);color:var(--ok)}
.st-cancelado{background:var(--cinza-bg);color:var(--cinza)}
.tag{display:inline-flex;align-items:center;gap:4px;border-radius:6px;padding:2px 7px;font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.04em}
.tag.urg{background:var(--vermelho);color:#fff}
.tag.maq{background:var(--tinta);color:#fff}
.tag.atraso{background:var(--vermelho-bg);color:var(--vermelho)}
.tag.cinza{background:var(--suave);color:var(--sub)}

/* Linha de item */
.itens{display:flex;flex-direction:column;gap:10px}
.item{background:var(--papel);border:1px solid var(--linha);border-radius:var(--raio);padding:12px;display:flex;flex-direction:column;gap:10px}
.item.urgente{border-left:6px solid var(--vermelho)}
.item .topo-i{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.thumb{width:68px;height:68px;border-radius:10px;background:var(--suave) center/cover no-repeat;flex:none;border:1px solid var(--linha);display:flex;align-items:center;justify-content:center;font-size:24px;color:var(--sub)}
.item .info{min-width:0;flex:1;display:flex;flex-direction:column;gap:4px}
.item .desc{font-weight:800;font-size:17px;line-height:1.25;overflow-wrap:anywhere}
.item .meta{font-size:14px;color:var(--sub);overflow-wrap:anywhere}
.item .linha-tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.acoes{display:flex;gap:8px;flex-wrap:wrap}
.acoes .btn{flex:1 1 150px}

/* Botões */
.btn{border:0;border-radius:12px;min-height:52px;padding:10px 16px;font-weight:800;font-size:16.5px;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--suave);color:var(--tinta);text-align:center;line-height:1.15}
.btn.prim{background:var(--verde2);color:#fff}
.btn.prim:active{background:var(--verde)}
.btn.ouro{background:var(--ouro);color:#2A2000}
.btn.lar{background:var(--laranja);color:#fff}
.btn.azul{background:var(--azul);color:#fff}
.btn.teal{background:var(--teal);color:#fff}
.btn.roxo{background:var(--roxo);color:#fff}
.btn.verm{background:var(--vermelho);color:#fff}
.btn.contorno{background:var(--papel);border:2px solid var(--linha)}
.btn.peq{min-height:42px;font-size:15px;padding:8px 12px}
.btn:disabled{background:var(--linha);color:var(--sub);cursor:not-allowed}
.btn.bloco{width:100%}
.novo-grande{min-height:72px;font-size:21px;font-family:var(--f-titulo);border-radius:16px}

/* Formulário */
.campo{display:flex;flex-direction:column;gap:6px}
.campo > label,.rot{font-weight:800;font-size:15.5px}
.campo .ob{color:var(--vermelho)}
.campo .dica{font-size:13.5px;color:var(--sub);margin-top:-2px}
input[type=text],input[type=number],input[type=password],input[type=tel],input[type=date],select,textarea{width:100%;border:2px solid var(--linha);background:var(--papel);border-radius:12px;padding:12px 14px;min-height:52px;font-size:17px}
textarea{min-height:84px;resize:vertical}
input.falta,select.falta,textarea.falta{border-color:#E9A39E;background:#FFF8F7}
.escolha{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.escolha button{min-height:58px;border-radius:12px;border:2.5px solid var(--linha);background:var(--papel);font-weight:900;font-size:17px;font-family:var(--f-titulo);letter-spacing:.02em}
.escolha button.on-urg{border-color:var(--vermelho);background:var(--vermelho);color:#fff}
.escolha button.on-nor{border-color:var(--ok);background:var(--ok);color:#fff}
.escolha button.on-sim{border-color:var(--tinta);background:var(--tinta);color:#fff}
.dois{display:grid;grid-template-columns:1.2fr 1fr;gap:10px}
.form-item{background:var(--papel);border:2px solid var(--linha);border-radius:var(--raio);padding:14px;display:flex;flex-direction:column;gap:14px}
.form-item .cab{display:flex;justify-content:space-between;align-items:center}
.form-item .cab h3{font-size:18px;color:var(--verde)}
.fotos{display:flex;gap:8px;flex-wrap:wrap}
.fotos .f{width:84px;height:84px;border-radius:10px;background:var(--suave) center/cover;position:relative;border:1px solid var(--linha)}
.fotos .f button{position:absolute;top:-8px;right:-8px;width:30px;height:30px;border-radius:50%;border:2px solid #fff;background:var(--vermelho);color:#fff;font-weight:900;font-size:14px;padding:0}
.fotos-btns{display:flex;gap:8px;flex-wrap:wrap}
.fotos-btns label{flex:1 1 140px}
.mini-chip{border:2px dashed var(--linha);background:var(--papel);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:800;color:var(--sub);align-self:flex-start}
.fixo-envio{position:sticky;bottom:calc(env(safe-area-inset-bottom,0px) + 76px);z-index:5;background:var(--papel);border:2px solid var(--linha);border-radius:16px;padding:12px;box-shadow:0 8px 24px rgba(23,36,26,.12);display:flex;flex-direction:column;gap:10px}
.falta-lista{font-size:14px;color:var(--vermelho);font-weight:700;margin:0;padding-left:18px;max-height:96px;overflow:auto}
.pronto{font-size:14.5px;color:var(--ok);font-weight:800}

/* Login */
.login{min-height:100vh;display:flex;flex-direction:column;background:var(--papel)}
.login .faixa{height:10px;background:linear-gradient(90deg,var(--verde) 0 60%,var(--broto) 60% 85%,var(--ouro) 85%)}
.login .wrap{width:100%;display:flex;flex-direction:column;gap:18px;padding-block:24px 40px}
.login .logo{width:min(280px,72vw);align-self:center}
.login h1{font-size:24px;text-align:center;color:var(--verde)}
.login .sub{text-align:center;color:var(--sub);margin:-10px 0 0}
.cargos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cargo-b{border:2.5px solid var(--linha);background:var(--fundo);border-radius:16px;padding:16px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:900;font-size:16.5px;text-align:center;line-height:1.15;min-height:118px;justify-content:center}
.cargo-b .ic{font-size:40px;line-height:1}
.cargo-b small{font-weight:700;color:var(--sub);font-size:12.5px}
.cargo-b.on{border-color:var(--verde2);background:var(--ok-bg)}
.nomes{display:flex;flex-direction:column;gap:8px}
.nome-b{border:2.5px solid var(--linha);background:var(--papel);border-radius:14px;padding:14px 16px;font-weight:800;font-size:18px;text-align:left;display:flex;justify-content:space-between;gap:10px;align-items:center}
.nome-b small{color:var(--sub);font-weight:700;font-size:13.5px}
.nome-b.on{border-color:var(--verde2);background:var(--ok-bg)}
.pin{letter-spacing:.5em;text-align:center;font-size:26px !important;font-weight:900}
.voltar{align-self:flex-start;border:0;background:none;color:var(--verde);font-weight:800;font-size:16px;padding:6px 0}
.erro{background:var(--vermelho-bg);color:var(--vermelho);font-weight:800;border-radius:12px;padding:10px 14px;font-size:15px}

/* Modal (tela cheia no celular) */
.modal-fundo{position:fixed;inset:0;background:rgba(15,25,15,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--fundo);width:100%;max-width:760px;max-height:94vh;overflow:auto;border-radius:20px 20px 0 0;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 18px);-webkit-overflow-scrolling:touch}
.modal .cab-m{position:sticky;top:0;background:var(--papel);border-bottom:1px solid var(--linha);z-index:2}
.modal .cab-m .wrap{display:flex;align-items:center;gap:10px;padding-block:12px}
.modal .cab-m h2{font-size:20px;flex:1;min-width:0}
.modal .corpo{display:flex;flex-direction:column;gap:14px;padding-block:14px}
.modal.peq{max-height:80vh}
.dados{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px 16px}
.dados div{display:flex;flex-direction:column;min-width:0}
.dados dt,.dados .k{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--sub)}
.dados .v{font-weight:800;overflow-wrap:break-word;word-break:normal;min-width:0}
.linha-tempo{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.linha-tempo li{display:grid;grid-template-columns:16px 1fr;gap:10px;position:relative;padding-bottom:12px}
.linha-tempo li::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--verde2);margin-top:5px;z-index:1}
.linha-tempo li::after{content:"";position:absolute;left:5px;top:16px;bottom:0;width:2px;background:var(--linha)}
.linha-tempo li:last-child::after{display:none}
.linha-tempo .q{font-size:13.5px;color:var(--sub);font-weight:700}
.fotos-grandes{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.fotos-grandes .fg{width:120px;height:120px;flex:none;border-radius:12px;background:var(--suave) center/cover;border:1px solid var(--linha)}
.trava{display:flex;gap:8px;align-items:center;font-size:13.5px;color:var(--sub);font-weight:700;background:var(--suave);border-radius:10px;padding:8px 12px}
.visor{position:fixed;inset:0;background:#000;z-index:60;display:flex;align-items:center;justify-content:center}
.visor img{max-width:100%;max-height:100%}
.visor button{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);right:calc(env(safe-area-inset-right,0px) + 12px);background:#fff;border:0;border-radius:50%;width:48px;height:48px;font-size:22px;font-weight:900;color:#000}

/* Fluxo */
.periodo{display:flex;gap:6px;flex-wrap:wrap}
.periodo button{border:2px solid var(--linha);background:var(--papel);border-radius:999px;padding:6px 14px;font-weight:800;font-size:14.5px}
.periodo button.on{background:var(--tinta);border-color:var(--tinta);color:#fff}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kpi{background:var(--papel);border:1px solid var(--linha);border-radius:var(--raio);padding:12px 14px}
.kpi .k{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--sub)}
.kpi .v{font-family:var(--f-titulo);font-size:28px;font-weight:900;line-height:1.1;margin-top:2px}
.kpi .s{font-size:12.5px;color:var(--sub);font-weight:700}
.fluxo{background:var(--papel);border:1px solid var(--linha);border-radius:var(--raio);padding:14px;display:flex;flex-direction:column;align-items:stretch}
.fx{border:2.5px solid var(--linha);border-radius:14px;padding:10px 12px;background:var(--papel);text-align:left;display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;align-items:center;width:100%}
.fx .ic{font-size:24px;grid-row:span 2}
.fx .t{font-weight:900;font-size:15px;line-height:1.15}
.fx .q{font-family:var(--f-titulo);font-size:28px;font-weight:900;grid-row:span 2;font-variant-numeric:tabular-nums}
.fx .s{font-size:12.5px;color:var(--sub);font-weight:700}
.fx.on{outline:3px solid var(--tinta);outline-offset:2px}
.fx.atras{border-color:var(--vermelho);background:var(--vermelho-bg)}
.fx.atras .s{color:var(--vermelho)}
.fx.k-amarelo{border-left:8px solid var(--ouro)} .fx.k-azul{border-left:8px solid var(--azul)} .fx.k-laranja{border-left:8px solid var(--laranja)}
.fx.k-roxo{border-left:8px solid var(--roxo)} .fx.k-teal{border-left:8px solid var(--teal)} .fx.k-verde{border-left:8px solid var(--ok)}
.seta{height:22px;display:flex;justify-content:center;color:var(--sub);font-size:18px;line-height:22px}
.ramos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ramo{display:flex;flex-direction:column;border:1.5px dashed var(--linha);border-radius:14px;padding:8px}
.ramo > .rt{font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.06em;text-align:center;padding:2px 0 8px}
.ramo.tem .rt{color:var(--azul)} .ramo.nao .rt{color:var(--laranja)}
@media (max-width:520px){
  .ramos{grid-template-columns:1fr}
  .fx .q{font-size:24px}
}
.barras{display:flex;flex-direction:column;gap:12px}
.barra .r{display:flex;justify-content:space-between;gap:10px;font-size:14.5px;font-weight:800}
.barra .r span:last-child{font-variant-numeric:tabular-nums}
.barra .trilho{height:14px;background:var(--suave);border-radius:7px;overflow:hidden;margin-top:4px}

/* login com lavoura */

.carregando{background:var(--verde);color:#E9F3DF}

/* login em formulário */
.login-form{display:flex;flex-direction:column;gap:14px;padding:18px}
.login-form h2{font-family:var(--f-titulo);font-size:26px;text-transform:uppercase;color:var(--verde)}
.login-form select{font-weight:700}
/* painel */
.ola h1{font-family:var(--f-titulo);font-size:30px;font-weight:800;color:var(--verde);line-height:1.05}
.ola p{margin:4px 0 0;color:var(--sub);font-weight:700;font-size:14.5px}
button.faixa-aviso{width:100%;text-align:left;font-size:16px;font-family:inherit;color:var(--tinta)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{position:relative;border:1px solid var(--linha);background:var(--papel);border-radius:16px;padding:14px;display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;min-height:128px;box-shadow:0 1px 0 rgba(60,45,20,.06);font-family:inherit;color:var(--tinta)}
.tile .t-ic{display:grid;place-items:center;width:44px;height:44px;border-radius:12px;background:var(--suave);color:var(--verde);font-size:22px;margin-bottom:4px}
.tile .t-n{position:absolute;top:12px;right:14px;font-family:var(--f-titulo);font-weight:800;font-size:32px;line-height:1;color:var(--sub)}
.tile .t-t{font-family:var(--f-titulo);font-weight:700;font-size:19px;line-height:1.1}
.tile .t-d{font-size:13px;color:var(--sub);font-weight:700;line-height:1.25}

.tile.c-amarelo .t-ic{background:var(--amarelo-bg);color:var(--amarelo)} .tile.c-amarelo.tem .t-n{color:var(--amarelo)}
.tile.c-azul .t-ic{background:var(--azul-bg);color:var(--azul)} .tile.c-azul.tem .t-n{color:var(--azul)}
.tile.c-laranja .t-ic{background:var(--laranja-bg);color:var(--laranja)} .tile.c-laranja.tem .t-n{color:var(--laranja)}

.tile.c-teal .t-ic{background:var(--teal-bg);color:var(--teal)} .tile.c-teal.tem .t-n{color:var(--teal)}

.st-devolvido{background:var(--vermelho-bg);color:var(--vermelho)}

function permsPadrao(cargo) { var pf = PERFIL[cargo]; return pf ? pf.obrig.concat(pf.padrao) : []; }
function permsPermitidas(cargo) { var pf = PERFIL[cargo]; return pf ? pf.obrig.concat(pf.opc) : []; }
/* Permissões efetivas: o que está gravado, limitado ao teto da função, sempre com as obrigatórias */
function permsDe(u) {
  if (!u || !PERFIL[u.cargo]) return [];
  var teto = permsPermitidas(u.cargo);
  var base = (u.permissoes || permsPadrao(u.cargo)).map(function (p) { return p === "pedido.cancelar" ? "pedido.excluir" : p; })
    .filter(function (p, i, a) { return teto.indexOf(p) >= 0 && a.indexOf(p) === i; });
  PERFIL[u.cargo].obrig.forEach(function (p) { if (base.indexOf(p) < 0) base.push(p); });
  return base;
}
function pode(p, u) { u = u || S.user; return !!u && u.ativo !== false && permsDe(u).indexOf(p) >= 0; }

      if (!ok) return;
      if (para === "devolvido" && !(extra && extra.nota)) return;
      e.st = para; e.t[para] = agora(); e.por = u.nome;
      e.info = e.info || {};

      if (para === "comprado") {

var DOWNLOADS = null;

function baixarArquivo(nome, conteudo, tipo) {
  var blob = conteudo instanceof Blob ? conteudo : new Blob([conteudo], { type: tipo });

function salvarPDF(doc, nome) {

/* Compressão de foto no aparelho (para caber no banco gratuito) */
function comprimir(file) {
  return new Promise(function (ok, erro) {
    var fr = new FileReader();
    fr.onload = function () {
      var img = new Image();
      img.onload = function () {
        var max = 1100, w = img.width, h = img.height, k = Math.min(1, max / Math.max(w, h));
        var c = document.createElement("canvas"); c.width = Math.round(w * k); c.height = Math.round(h * k);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        var q = 0.62, url = c.toDataURL("image/jpeg", q);
        while (url.length > 700000 && q > 0.3) { q -= 0.08; url = c.toDataURL("image/jpeg", q); }
        ok(url);
      };
      img.onerror = function () { erro(new Error("Não deu para ler essa imagem.")); };
      img.src = fr.result;
    };
    fr.onerror = function () { erro(new Error("Não deu para ler o arquivo.")); };
    fr.readAsDataURL(file);
  });
}

function calcTempos(itens) {

  var voltar = S.aberto; abrirModal("Estoque parcial", h, true); S.aberto = voltar;
  setTimeout(function () { var x = $("#pqTem"); if (x) x.focus(); }, 60);

function executarParcial(pid, i) {
  var x = Number(String(($("#pqTem") || {}).value || "").replace(",", ".")), nota = (($("#pqNota") || {}).value || "").trim();
  var p0 = pedidoPorId(pid); if (!p0) return; var q0 = Number(p0.itens[i].quantidade);
  if (!(x > 0)) return toast("Informe quanto tem no estoque.");
  if (!(x < q0)) return toast("Se tem tudo, use \"Tem no estoque – separar\".");
  var b = $("#bParcial"); if (b) { b.disabled = true; b.textContent = "Salvando…"; }
  var u = S.user, voltar = S.aberto;
  API.mutar(pid, function (p) {
    var e = p.estado[i], it = p.itens[i];
    if (!e || e.st !== "aguardando" || !pode("estoque.atender", u) || p.itens.length >= MAX_TOTAL_ITENS) return false;
    var q = Number(it.quantidade); if (!(x > 0 && x < q)) return false;
    var resto = Math.round((q - x) * 1000) / 1000, t = agora();
    var novo = copia(it); novo.quantidade = resto; novo.parteDe = i;
    it.quantidade = x;
    e.st = "separado"; e.t.separado = t; e.por = u.nome; e.info = e.info || {}; e.info.parcial = { pedido: q, separado: x };
    var ne = { st: "compra", t: { aguardando: e.t.aguardando || p.criadoEm, compra: t }, por: u.nome, info: { parteDe: i } };
    if (nota) ne.info.nota_compra = nota;
    p.itens.push(novo); p.estado.push(ne); p.teveCompra = true;
    var txt = x + " " + it.unidade + " separados · " + resto + " " + it.unidade + " para compra" + (nota ? " · " + nota : "");
    p.historico.push({ em: t, por: u.uid, nome: u.nome, cargo: u.cargo, acao: "Estoque tinha só uma parte", itens: [i, p.itens.length - 1], nota: txt });
    p.status = statusPedido(p); p.atualizadoEm = t;
    return { n: 1, aud: regAud("pedido_status", p.id, numPed(p.numero), "Estoque parcial – " + it.descricao + ": " + txt) };
  }).then(function () {
    toast("✔ Separado o que tem; o restante foi para Compras.", 4500);
    if (voltar) abrirPedido(voltar); else fecharModal();
  }).catch(function (e) { toast(e.message || String(e), 6000); if (voltar) abrirPedido(voltar); else fecharModal(); });

  if (ev.target.id === "fUsu") { ev.preventDefault(); if (pode("admin.usuarios")) salvarUsuario($("#bUsu").getAttribute("data-v") || null); }
  if (ev.target.id === "fSenha") { ev.preventDefault(); trocarSenha(); }
  if (ev.target.id === "fNome") { ev.preventDefault(); salvarMeuNome(); }
  if (ev.target.id === "fCorr") { ev.preventDefault(); salvarCorrecao(ev.target.getAttribute("data-p")); }
});
/* Atualiza contadores de tempo a cada minuto */
setInterval(function () { if (S.user && !$("#modais").innerHTML && S.tela !== "novo" && S.tela !== "equipe" && S.tela !== "config" && !(document.activeElement && document.activeElement.id === "fBusca")) render(true); }, 60000);

if ("serviceWorker" in navigator && location.protocol === "https:" && !/claude|claudeusercontent/.test(location.hostname)) {
  navigator.serviceWorker.register("sw.js").catch(function () {});
}
iniciar();
